version: "3.8"

# ============================================================
# Galaxium Travels — Log Intelligence Stack
# ============================================================
# Services:
#   opensearch          — stores and indexes all log records
#   opensearch-dashboards — web UI at http://localhost:5601
#   data-prepper        — parses and enriches incoming logs
#   otel-collector      — receives logs from all apps/tools
#
# Start: podman compose up -d
# Stop:  podman compose down
# ============================================================

services:

  # ----------------------------------------------------------
  # OpenSearch — log storage and search engine
  # ----------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_PASSWORD:-Galaxium2026Secure}
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://localhost:9200 -u admin:${OPENSEARCH_PASSWORD:-Galaxium2026Secure} | grep -q opensearch"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ----------------------------------------------------------
  # OpenSearch Dashboards — web UI
  # Open http://localhost:5601  (user: admin, password: Admin@1234!)
  # ----------------------------------------------------------
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.13.0
    container_name: opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=https://opensearch:9200
      - OPENSEARCH_USERNAME=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD:-Galaxium2026Secure}
      - OPENSEARCH_SSL_VERIFICATIONMODE=none
    depends_on:
      opensearch:
        condition: service_healthy

  # ----------------------------------------------------------
  # Data Prepper — log parsing, enrichment, and routing
  # ----------------------------------------------------------
  data-prepper:
    image: opensearchproject/data-prepper:2.8.0
    container_name: data-prepper
    volumes:
      - ./pipelines.yaml:/usr/share/data-prepper/pipelines/pipelines.yaml
      - ./org-logs-template.json:/usr/share/data-prepper/templates/org-logs-template.json
    ports:
      - "21890:21890"   # OTLP input from OTEL Collector
      - "4900:4900"     # Data Prepper API (health checks)
    environment:
      - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD:-Galaxium2026Secure}
    depends_on:
      opensearch:
        condition: service_healthy

  # ----------------------------------------------------------
  # OTEL Collector — receives logs from all apps and tools
  # Apps send to: localhost:4317 (gRPC) or localhost:4318 (HTTP)
  # ----------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.100.0
    container_name: otel-collector
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
      # Mount app log files so the filelog receiver can read them
      - ../booking_system_backend/jobs/logs:/app/jobs/logs:ro
    ports:
      - "4317:4317"   # OTLP gRPC — all SDK-instrumented apps point here
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus metrics (optional)
    depends_on:
      - data-prepper

volumes:
  opensearch-data:
    driver: local
