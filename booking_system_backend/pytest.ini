[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
filterwarnings =
    # Pydantic 2.11 internal deprecation — triggered by fastapi-mcp schema generation,
    # not by application code. Remove once fastapi-mcp is updated.
    ignore::pydantic.warnings.PydanticDeprecatedSince211
