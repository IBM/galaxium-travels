# Test datasource — in-memory H2 replaces SQLite so no file is needed on disk
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Use H2 dialect instead of the custom SQLite dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Create schema automatically and drop it afterwards
spring.jpa.hibernate.ddl-auto=create-drop

# Suppress SQL noise in test output
spring.jpa.show-sql=false

# Disable JSP view resolver configuration that is irrelevant in tests
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# Python backend stub URL (not called in these bootstrap tests)
python.backend.url=http://localhost:9999

# Hold configuration
hold.duration.minutes=15
hold.expiration.check.interval.seconds=60

# Keep logging quiet during tests
logging.level.root=WARN
logging.level.com.galaxium.holdservice=WARN
