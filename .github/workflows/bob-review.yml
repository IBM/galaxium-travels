name: 🤖 Bob Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    name: Bob reviews this PR
    # Skip draft PRs and bot-authored PRs to avoid loops
    if: >
      github.event.pull_request.draft == false &&
      !endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for gh pr diff to resolve merge base

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Bob Shell
        run: curl -fsSL https://bob.ibm.com/download/bobshell.sh | bash -s -- --pm npm

      - name: Fetch PR diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr diff ${{ github.event.pull_request.number }} > pr.diff

      - name: Run Bob Shell review
        env:
          BOBSHELL_API_KEY: ${{ secrets.BOBSHELL_API_KEY }}
        run: |
          # How to review (two-pass process, PR categories, what the review contains)
          # lives in the pr-reviewer custom mode in .bob/custom_modes.yaml. That mode
          # only has the `read` tool group, so Bob cannot edit files or run commands.
          # This prompt only states the task and the output markers the next step parses.
          cat > prompt.txt << 'PROMPT'
          Review the pull request whose diff is in @pr.diff.

          Output the review to stdout, bracketed by these two marker lines exactly, each on its own line:

          <<<BOB_REVIEW_BEGIN>>>
          ...your review markdown...
          <<<BOB_REVIEW_END>>>
          PROMPT
          bob run --mode pr-reviewer --accept-license --trust "$(cat prompt.txt)" 2>&1 | tee bob_output.txt

      - name: Extract review from Bob's stdout
        run: |
          python3 -c "
          import re, sys
          text = open('bob_output.txt').read()
          matches = re.findall(r'<<<BOB_REVIEW_BEGIN>>>(.*?)<<<BOB_REVIEW_END>>>', text, re.DOTALL)
          if matches:
              print(matches[-1].strip())
          else:
              print('_Bob did not produce a structured review. Raw output below._\n')
              print(text)
          " > review_body.md
          {
            echo "## 🤖 Bob's Review"
            echo ""
            echo "*Posted by [Bob Shell](https://bob.ibm.com), IBM's CLI agent — running headless on GitHub Actions.*"
            echo ""
            echo "---"
            echo ""
            cat review_body.md
          } > review.md
          echo "--- Final review ---"
          cat review.md

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr review ${{ github.event.pull_request.number }} --comment --body-file review.md
