name: 🤖 Bob Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    name: Bob reviews this PR
    # Skip draft PRs and bot-authored PRs to avoid loops
    if: >
      github.event.pull_request.draft == false &&
      !endsWith(github.event.pull_request.user.login, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for gh pr diff to resolve merge base

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Bob Shell
        run: curl -fsSL https://bob.ibm.com/download/bobshell.sh | bash -s -- --pm npm

      - name: Fetch PR diff and changed-file list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Bob's read_file truncates long files, and a truncated read can look like a
          # complete one (PR #146: Bob reviewed the docs at the top of an 87 KB diff
          # and never reached the code). So code files go first in pr.diff, generated
          # output under .bob/artifacts/ is left out, and the prompt states every
          # changed file and the diff's length so Bob can tell when it stopped early.
          cat > diff-order.txt << 'ORDER'
          booking_system_backend
          booking_system_inventory_hold_service
          booking_system_frontend
          e2e
          .github
          .bob
          scripts
          ORDER
          # Prefix every hunk line with its line number in the new file (blank for
          # removed lines), so Bob cites source line numbers, not pr.diff positions.
          git diff -O diff-order.txt "$BASE_SHA...$HEAD_SHA" -- . ':(exclude).bob/artifacts' \
            | awk '
                /^diff --git / { in_hunk = 0; print; next }
                /^@@ / { in_hunk = 1; match($0, /\+[0-9]+/); n = substr($0, RSTART + 1, RLENGTH - 1); print; next }
                in_hunk && /^[ +]/ { printf "%6d %s\n", n, $0; n++; next }
                in_hunk && /^-/ { printf "%6s %s\n", "", $0; next }
                { print }
              ' > pr.diff
          gh pr view "$PR_NUMBER" --json files --jq '.files[]
            | "- \(.path) (+\(.additions) -\(.deletions))"
              + (if (.path | startswith(".bob/artifacts/")) then " (generated output, not in pr.diff)" else "" end)' \
            > changed_files.txt

      - name: Run Bob Shell review
        env:
          BOBSHELL_API_KEY: ${{ secrets.BOBSHELL_API_KEY }}
        run: |
          # How to review (two-pass process, PR categories, what the review contains)
          # lives in the pr-reviewer custom mode in .bob/custom_modes.yaml. That mode
          # only has the `read` tool group, so Bob cannot edit files or run commands.
          # This prompt only states the task, the scope of the diff and the output
          # markers the next step parses.
          {
            echo "Review the pull request whose diff is in @pr.diff."
            echo ""
            echo "pr.diff is $(wc -l < pr.diff | tr -d ' ') lines long, with code files first. This PR changes these files:"
            cat changed_files.txt
            cat << 'PROMPT'

          Output the review to stdout, bracketed by these two marker lines exactly, each on its own line:

          <<<BOB_REVIEW_BEGIN>>>
          ...your review markdown...
          <<<BOB_REVIEW_END>>>
          PROMPT
          } > prompt.txt
          bob run --mode pr-reviewer --accept-license --trust "$(cat prompt.txt)" 2>&1 | tee bob_output.txt

      - name: Extract review from Bob's stdout
        run: |
          python3 -c "
          import re, sys
          text = open('bob_output.txt').read()
          matches = re.findall(r'<<<BOB_REVIEW_BEGIN>>>(.*?)<<<BOB_REVIEW_END>>>', text, re.DOTALL)
          if matches:
              print(matches[-1].strip())
          else:
              print('_Bob did not produce a structured review. Raw output below._\n')
              print(text)
          " > review_body.md
          {
            echo "## 🤖 Bob's Review"
            echo ""
            echo "*Posted by [Bob Shell](https://bob.ibm.com), IBM's CLI agent — running headless on GitHub Actions.*"
            echo ""
            echo "---"
            echo ""
            cat review_body.md
          } > review.md
          echo "--- Final review ---"
          cat review.md

      - name: Post review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr review ${{ github.event.pull_request.number }} --comment --body-file review.md
